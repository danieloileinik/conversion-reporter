name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ConversionReporter.slnx
      - name: Build
        id: build
        run: dotnet build ConversionReporter.slnx --configuration Release --no-restore
      - name: Unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test tests/ConversionReporter.Tests
          --configuration Release --no-build --verbosity normal
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults/unit
      - name: Integration tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >-
          dotnet test tests/ConversionReporter.IntegrationTests
          --configuration Release --no-build --verbosity normal
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults/integration
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

